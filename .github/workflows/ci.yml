name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check IPC channel contract
        run: pnpm check:ipc-channels

      - name: Check IPC channel usage coverage
        run: pnpm check:ipc-channel-usage

      - name: Typecheck desktop
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build desktop
        run: pnpm build

      - name: Electron E2E
        run: xvfb-run -a pnpm test:e2e

      - name: Upload Electron E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Typecheck mobile
        run: pnpm mobile:typecheck

      - name: Build mobile web
        run: pnpm mobile:build
